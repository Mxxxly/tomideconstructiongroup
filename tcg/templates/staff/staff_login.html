<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Login</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: #fff8e1; /* Soft yellow background */
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .login-card {
      background: #fff9c4; /* Pale yellow card */
      padding: 2rem;
      border-radius: 15px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
      width: 100%;
      max-width: 400px;
      text-align: center;
    }
    .login-card h2 {
      margin-bottom: 1.5rem;
      color: #fbc02d; /* Bold yellow heading */
      font-weight: 600;
    }
    .form-control:focus {
      border-color: #fdd835;
      box-shadow: 0 0 0 0.2rem rgba(255, 235, 59, 0.25);
    }
    .btn-login {
      background: #fbc02d;
      color: #fff;
      font-weight: 500;
      transition: background 0.3s;
    }
    .btn-login:hover {
      background: #f9a825;
    }
    .alert {
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <h2>Staff Login</h2>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, msg in messages %}
          <div class="alert alert-{{ category }} alert-dismissible fade show text-center" role="alert">
            {{ msg }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('staff_login') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <input type="email" name="email" class="form-control mt-3" placeholder="Email" required>
      <input type="password" name="password" class="form-control mt-3" placeholder="Password" required>

      <button class="btn btn-login mt-4 w-100">Login</button>
    </form>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

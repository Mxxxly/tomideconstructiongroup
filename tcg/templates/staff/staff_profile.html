<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Edit Profile</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5" style="max-width: 500px;">
<h3>Edit Profile</h3>

{% with messages = get_flashed_messages(with_categories=true) %}
{% if messages %}
    {% for category, msg in messages %}
        <div class="alert alert-{{ category }}">{{ msg }}</div>
    {% endfor %}
{% endif %}
{% endwith %}

<form method="POST">
    <input type="text" name="full_name" class="form-control mb-2" value="{{ staff.full_name }}" required>
    <input type="email" name="email" class="form-control mb-2" value="{{ staff.email }}" required>
    <input type="text" name="phone" class="form-control mb-2" value="{{ staff.phone }}">
    <input type="password" name="password" class="form-control mb-2" placeholder="New Password (optional)">
    <button class="btn btn-primary w-100">Update Profile</button>
</form>

<a href="{{ url_for('staff_dashboard') }}" class="btn btn-secondary mt-3 w-100">Back to Dashboard</a>
</div>
</body>
</html>

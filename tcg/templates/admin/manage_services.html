<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Services - TCG Admin</title>

    <link 
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" 
        rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='fontawesome/css/all.min.css') }}">


    <style>
        body { background: #f5f6fa; }
        .container-box { max-width: 1100px; margin: auto; }
        .card { border-radius: 10px; }
    </style>
</head>

<body>

<div class="container container-box mt-5">

    <div class="col-md-12 d-flex justify-content-between">
        <a style="border: none; color: black;" href="{{url_for('admin_dashboard')}}" class="me-5"> <i class="fa-solid fa-arrow-left"></i></a>
    
    <h2 class="mb-4">Manage Services</h2>

      </div>



    <div class="row">

        <!-- ADD CATEGORY -->
        <div class="col-md-6 mb-4">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h5>Add Service Category</h5>
                    <form method="POST" action="/admin/manage-services/">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        <input type="hidden" name="form_type" value="category">

                        <input type="text" name="name" 
                            class="form-control mt-2" 
                            placeholder="Category Name" required>

                        <button class="btn btn-primary btn-sm mt-3">Add Category</button>
                    </form>
                </div>
            </div>
        </div>

        <!-- ADD SUBCATEGORY -->
        <div class="col-md-6 mb-4">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h5>Add Subcategory</h5>
                    <form method="POST" action="/admin/manage-services/">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                        <input type="hidden" name="form_type" value="subcategory">

                        <select name="category_id" class="form-control mt-2" required>
                            <option value="">Select Category</option>
                            {% for c in categories %}
                                <option value="{{ c.id }}">{{ c.name }}</option>
                            {% endfor %}
                        </select>

                        <input type="text" name="name" 
                            class="form-control mt-2" 
                            placeholder="Subcategory Name" required>

                        <button class="btn btn-primary btn-sm mt-3">Add Subcategory</button>
                    </form>
                </div>
            </div>
        </div>

    </div>

    <!-- LISTS -->
    <div class="row">

        <!-- CATEGORY LIST -->
        <div class="col-md-6 mb-4">
            <h5>Categories</h5>
            <ul class="list-group">
                {% for c in categories %}
                <li class="list-group-item d-flex justify-content-between">
                    {{ c.name }}
                    <a href="/admin/delete-category/{{ c.id }}/" 
                       class="btn btn-danger btn-sm">Delete</a>
                </li>
                {% endfor %}
            </ul>
        </div>

        <!-- SUBCATEGORY LIST -->
        <div class="col-md-6 mb-4">
            <h5>Subcategories</h5>
            <ul class="list-group">
                {% for s in subcategories %}
                <li class="list-group-item d-flex justify-content-between">
                    {{ s.name }} ({{ s.category.name }})
                    <a href="{{ url_for('admin_delete_subcat', id=s.id) }}" 
                       class="btn btn-danger btn-sm">Delete</a>
                </li>
                {% endfor %}
            </ul>
        </div>

    </div>

</div>

<script 
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
